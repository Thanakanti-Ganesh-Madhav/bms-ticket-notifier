name: BMS Ticket Checker

on:
  schedule:
    # Every 15 minutes, offset from the busy start of the hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:  # Manual trigger button

# Never let two runs read and write bms_state.json at the same time.
concurrency:
  group: bms-checker
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Latest branch tip, so a queued run sees the newest state file.
          ref: ${{ github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_FORMAT: ${{ vars.BMS_FORMAT }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_TIME: ${{ vars.BMS_TIME }}
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: '1'
        run: uv run --frozen main.py

      - name: Commit updated state
        # Also runs after a partial failure, so sent alerts are not repeated.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -m "chore: update bms_state.json [skip ci]"
          git push || { git pull --rebase -X theirs && git push; }
