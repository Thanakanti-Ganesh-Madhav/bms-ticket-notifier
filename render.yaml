services:
  - type: web
    name: bms-ticket-notifier
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_TO_EMAIL
        value: chickoopiku19@gmail.com
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CHECK_INTERVAL
        value: "60"
